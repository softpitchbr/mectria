name: Hub comercial

on:
  push:
    paths:
      - "hub/**"
      - ".github/workflows/hub.yml"
  pull_request:
    paths:
      - "hub/**"
      - ".github/workflows/hub.yml"

permissions:
  contents: read

jobs:
  verificar:
    # Fixo no 24.04: o ubuntu-latest passou para o 26.04, que o Playwright 1.56.1 não suporta
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Trocar junto com a versão do Playwright.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-e2e
          path: hub/test-results/
          retention-days: 7
